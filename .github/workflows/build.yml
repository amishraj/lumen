name: Build & Release Lumen

# Push a tag like v1.1.0 to cut a release, or run manually from the Actions tab.
# One app ships both experiences (Aurora + Classic, chosen in-app), so every
# tag is a normal release and releases/latest always points at the newest build.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test

  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Release keystore from repo secrets (see server/README.md → signing).
      # Absent secrets fall back to the debug keystore so forks still build.
      # NB: `if` must test `secrets` directly — a step's own `env:` block is
      # NOT in scope for that step's `if`, so `env.KEYSTORE_BASE64 != ''`
      # silently evaluates empty and skips the decode.
      - name: Decode keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lumen.keystore"
      # Per-ABI APKs (smaller) + a universal APK that installs on any device,
      # including Google TV / Android TV (leanback launcher is declared).
      - run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_BASE64 != '' && format('{0}/lumen.keystore', runner.temp) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - run: flutter build apk --release --obfuscate --split-debug-info=build/symbols
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_BASE64 != '' && format('{0}/lumen.keystore', runner.temp) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Lumen-universal.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/Lumen-arm64.apk || true
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/Lumen-armv7.apk || true
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk

  macos:
    name: macOS (.app zip)
    runs-on: macos-14
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Zip app
        run: |
          mkdir -p dist
          cd build/macos/Build/Products/Release
          zip -r -y "$GITHUB_WORKSPACE/dist/Lumen-macOS.zip" Lumen.app || \
          zip -r -y "$GITHUB_WORKSPACE/dist/Lumen-macOS.zip" *.app
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip

  ios:
    name: iOS (unsigned IPA for sideloading)
    runs-on: macos-14
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Unsigned build — install with AltStore / Sideloadly / your own cert.
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          mkdir -p dist Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r -y dist/Lumen-iOS-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: dist/*.ipa
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.ipa
